                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/AdoptResponse'
  /adopt/breading:
    post:
      tags: [AdoptBreading]
      summary: "申请寄养"
      operationId: addBreading
      requestBody:
        required: true
        content:
          application/json:
            schema:
