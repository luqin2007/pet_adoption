components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Result:
      type: object
      description: "统一响应"
      properties:
        code:
          type: integer
          description: "业务状态码"
        message:
          type: string
          description: "响应消息"
        data:
          description: "响应数据"
      required:
        - code
        - message
    Empty:
      type: object
      description: "空响应"
    AdoptAddRequest:
      type: object
      description: "AdoptAddRequest"
      required:
        - petId
        - applicantPhone
      properties:
        petId:
          type: integer
          format: int64
          description: "petId"
        applicantPhone:
          type: string
          description: "applicantPhone"
        requirement:
          type: string
          description: "requirement"
    AdoptQueryParams:
      type: object
      description: "AdoptQueryParams"
      properties:
        pet:
          type: array
          items:
            type: integer
            format: int64
          description: "pet"
        user:
          type: array
          items:
            type: integer
            format: int64
          description: "user"
        status:
          type: array
          items:
            type: string
          description: "status"
        time0:
          type: string
          format: date-time
          description: "time0"
        time1:
          type: string
          format: date-time
          description: "time1"
    AdoptResponse:
      type: object
      description: "AdoptResponse"
      properties:
        id:
          type: integer
          format: int64
          description: "id"
        status:
          $ref: '#/components/schemas/AdoptBreadingStatus'
          description: "status"
        requirement:
          type: string
          description: "requirement"
        rejectReason:
          type: string
          description: "rejectReason"
        reviewTime:
          type: string
          format: date-time
          description: "reviewTime"
        adoptTime:
          type: string
          format: date-time
          description: "adoptTime"
        createTime:
          type: string
          format: date-time
          description: "createTime"
        updateTime:
          type: string
          format: date-time
          description: "updateTime"
        followTasks:
          type: array
          items:
            $ref: '#/components/schemas/FollowTaskResponse'
          description: "followTasks"
        petId:
          type: integer
          format: int64
          description: "petId"
        petName:
          type: string
          description: "petName"
        petCover:
          type: string
          description: "petCover"
        applicantId:
          type: integer
          format: int64
          description: "applicantId"
        applicantName:
          type: string
          description: "applicantName"
        applicantPhone:
          type: string
          description: "applicantPhone"
        applicantAvatar:
          type: string
          description: "applicantAvatar"
        reviewerId:
          type: integer
          format: int64
          description: "reviewerId"
        reviewerName:
          type: string
          description: "reviewerName"
        reviewerAvatar:
          type: string
          description: "reviewerAvatar"
    AgreementAddRequest:
      type: object
      description: "AgreementAddRequest"
      required:
        - parentId
        - parentType
        - type
      properties:
        uuid:
          type: string
          description: "临时上传批次 id。"
