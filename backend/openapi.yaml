openapi: 3.0.3
info:
  title: Pet Adoption API
  version: 1.0.0
  description: 根据 backend Spring Controller 与 DTO 自动生成的接口说明。
servers:
  - url: http://localhost:8080
paths:
  /assets/{folder}/{parentId}/{filename}:
    get:
      tags: [Asset]
      summary: "获取资源文件"
      operationId: getAsset
      parameters:
        - name: folder
          in: path
          required: true
          description: "资源目录，对应 assetUrl 中的目录名"
          schema:
            type: string
        - name: parentId
          in: path
          required: true
          description: "资源所属实体 id"
          schema:
            type: integer
            format: int64
        - name: filename
          in: path
          required: true
          description: "资源文件名"
          schema:
            type: string
      responses:
        '200':
          description: 请求成功，返回资源文件内容
          content:
            image/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: 资源不存在
  /adopt/adopt:
    post:
      tags: [AdoptBreading]
      summary: "申请领养"
      operationId: addAdopt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdoptAddRequest'
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/AdoptResponse'
    get:
      tags: [AdoptBreading]
      summary: "获取领养申请"
      operationId: getAdopts
      parameters:
        - name: pet
          in: query
          required: false
          description: "pet"
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: user
          in: query
          required: false
          description: "user"
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: status
          in: query
          required: false
          description: "status"
          schema:
            type: array
            items:
              type: string
        - name: time0
          in: query
          required: false
          description: "time0"
          schema:
            type: string
            format: date-time
        - name: time1
          in: query
          required: false
          description: "time1"
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          required: false
          description: "sort"
          schema:
            type: string
        - name: order
          in: query
          required: false
          description: "order"
          schema:
            type: string
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      records:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdoptResponse'
                      total:
                        type: integer
                        format: int64
                      size:
                        type: integer
                        format: int64
                      current:
                        type: integer
                        format: int64
                      pages:
                        type: integer
                        format: int64
  /adopt/adopt/{id}:
    get:
      tags: [AdoptBreading]
      summary: "获取领养申请"
      operationId: getAdopt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
