  /adopt/agreement/upload/{_id}:
    post:
      tags: [AdoptBreading]
      summary: "起草阶段上传协议扫描件"
      operationId: uploadAgreementWhenAdd
      parameters:
        - name: _id
          in: path
          required: true
          schema:
            type: string
