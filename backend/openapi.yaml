    get:
      tags: [AdoptBreading]
      summary: "获取寄养申请"
      operationId: getBreadingPets
      parameters:
        - name: applicant
          in: query
          required: false
          description: "applicant"
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: reviewer
          in: query
          required: false
          description: "reviewer"
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: status
          in: query
          required: false
          description: "status"
          schema:
            type: array
            items:
              type: string
        - name: petType
          in: query
          required: false
          description: "petType"
          schema:
            type: array
            items:
              type: string
        - name: time0
          in: query
          required: false
          description: "time0"
          schema:
            type: string
            format: date-time
        - name: time1
          in: query
          required: false
          description: "time1"
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          required: false
          description: "sort"
          schema:
            type: string
        - name: order
          in: query
          required: false
          description: "order"
          schema:
            type: string
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      records:
                        type: array
                        items:
                          $ref: '#/components/schemas/BreadingResponse'
                      total:
                        type: integer
                        format: int64
                      size:
                        type: integer
                        format: int64
                      current:
                        type: integer
                        format: int64
                      pages:
                        type: integer
                        format: int64
  /adopt/breading/{id}:
    get:
      tags: [AdoptBreading]
      summary: "获取寄养申请"
      operationId: getBreading
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
